<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — WallNova</title>
<style>
  :root{
    --bg:#0a0a12; --bg-soft:#12121e; --card:#161626; --line:#ffffff14;
    --text:#f2f3fb; --muted:#9a9db3; --accent:#ff5fae; --accent2:#6a5cff; --accent3:#3ee6c4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent3);text-decoration:none}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:#0a0a12ee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:15px}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 6%}
  .box{max-width:420px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:48px 34px}
  .icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:26px;margin:0 auto 20px}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:-1px}
  p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 26px}
  .email{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 28px;border-radius:12px;font-weight:700;font-size:15px}
  footer{border-top:1px solid var(--line);padding:30px 5%;color:var(--muted);text-align:center;font-size:13px}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="dot">WN</span> WallNova</a>
  <a href="index.html">← Home par wapas</a>
</header>

<div class="wrap">
  <div class="box">
    <div class="icon">✉️</div>
    <h1>Humse baat karo</h1>
    <p>Koi feedback, wallpaper request, ya copyright se juda sawal ho — humein email karo, hum jald se jald reply karenge.</p>
    <a class="email" href="mailto:himanshu22maurya22@gmail.com">himanshu22maurya22@gmail.com</a>
  </div>
</div>

<footer>© 2026 WallNova.com</footer>
</body>
</html>
